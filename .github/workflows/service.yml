name: service

# Checks the research-runs service (service/) on every change, and deploys it
# to Cloudflare from main once the Cloudflare secrets exist.
#
# One-time setup for deploys (Settings -> Secrets and variables -> Actions):
#   secrets   CLOUDFLARE_API_TOKEN   token with Workers Scripts:Edit and D1:Edit
#             CLOUDFLARE_ACCOUNT_ID
#             RESEARCH_RUNNER_TOKEN  also used by research_run.yml
#             RESEARCH_ADMIN_TOKEN
#             ANTHROPIC_API_KEY      optional; without it plans and reports are scripted
#             RESEARCH_GITHUB_TOKEN  optional; actions:write on this repo, for DISPATCHER=github
#             STRIPE_WEBHOOK_SECRET  optional; turns on /v1/webhooks/stripe
#   variables D1_DATABASE_ID         from `wrangler d1 create research-runs`
#             RESEARCH_API_URL       the Worker's URL, e.g. https://research-runs.<subdomain>.workers.dev
#             RESEARCH_DISPATCHER    mock | queue | github (default github)
# Without CLOUDFLARE_API_TOKEN the deploy job is skipped and only the checks run.

on:
  pull_request:
    paths: ["service/**", ".github/workflows/service.yml"]
  push:
    branches: [main]
    paths: ["service/**", ".github/workflows/service.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: End-to-end loop on a local D1 (mock dispatcher)
        run: npm run e2e

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.RESEARCH_API_URL }}
    defaults:
      run:
        working-directory: service
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip when Cloudflare isn't set up
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "${{ vars.D1_DATABASE_ID }}" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or D1_DATABASE_ID is not set; skipping the deploy"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service/package-lock.json
      - if: steps.gate.outputs.go == 'true'
        run: npm ci
      - name: Point wrangler.toml at the production database
        if: steps.gate.outputs.go == 'true'
        run: sed -i 's/^database_id = .*/database_id = "${{ vars.D1_DATABASE_ID }}"/' wrangler.toml
      - name: Apply D1 migrations
        if: steps.gate.outputs.go == 'true'
        run: npx wrangler d1 migrations apply research-runs --remote
      - name: Deploy the Worker
        if: steps.gate.outputs.go == 'true'
        run: |
          npx wrangler deploy \
            --var "DISPATCHER:${{ vars.RESEARCH_DISPATCHER || 'github' }}" \
            --var "PUBLIC_URL:${{ vars.RESEARCH_API_URL }}" \
            --var "GITHUB_REPO:${{ github.repository }}"
      - name: Sync secrets
        if: steps.gate.outputs.go == 'true'
        env:
          RUNNER_TOKEN: ${{ secrets.RESEARCH_RUNNER_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.RESEARCH_ADMIN_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.RESEARCH_GITHUB_TOKEN }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          # Only the secrets that are set; an unset one keeps its current value on the Worker.
          node -e 'const k=["RUNNER_TOKEN","ADMIN_TOKEN","ANTHROPIC_API_KEY","GITHUB_TOKEN","STRIPE_WEBHOOK_SECRET"];
            const o={};for(const n of k)if(process.env[n])o[n]=process.env[n];
            require("fs").writeFileSync(process.env.RUNNER_TEMP+"/secrets.json",JSON.stringify(o))'
          npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"
      - name: Smoke test
        if: steps.gate.outputs.go == 'true' && vars.RESEARCH_API_URL != ''
        run: |
          curl -fsS "${{ vars.RESEARCH_API_URL }}/v1/projects/golf/leaderboard" | head -c 600
