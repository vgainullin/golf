name: web

on:
  pull_request:
    paths: ["web/**"]
  push:
    branches: [main]
    paths: ["web/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test web/tests/*.test.mjs
